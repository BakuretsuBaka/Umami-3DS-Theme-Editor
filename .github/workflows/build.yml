name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test Umami3DSThemeEditor.sln --configuration Release

  # GitHub is often out of macOS runners, which turned master builds red for no fault of the code. Releases (which wait for
  # these tests) and pull requests still run them; pushes to master test on Linux and Windows only.
  test-macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test Umami3DSThemeEditor.sln --configuration Release

  # Built on every push so a broken installer shows up before a release; the release job picks the files up from here
  package-windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        run: |
          if [ ! -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup -y --no-progress; fi
      - name: Package Windows (portable zip and setup.exe)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION=0.0.0-dev
          bash packaging/package.sh "$VERSION" "win-x64 win-arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  # The release stays a draft until the macOS downloads are in, so it never goes out without them
  publish:
    needs: [test, test-macos, package-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Package Linux
        run: bash packaging/package.sh "${GITHUB_REF_NAME#v}" "linux-x64 linux-arm64"
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true

  publish-macos:
    needs: publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Package macOS (ad-hoc signed .dmg)
        run: bash packaging/package.sh "${GITHUB_REF_NAME#v}" "osx-x64 osx-arm64"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
